[project]
name = "magma-frontier"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "huggingface_hub>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magma_frontier"]
